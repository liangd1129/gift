<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #888;
    font-family: "Songti SC", "SimSun", "Noto Serif SC", "宋体", serif;
    min-height: 100vh;
    cursor: pointer;
    overflow: hidden;
  }

  /* 噪点层 */
  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* 连接建立页 */
  #connect-screen {
    position: fixed;
    inset: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
    z-index: 50;
  }
  #connect-screen.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .connect-text {
    font-size: 14px;
    color: #666;
    letter-spacing: 3px;
    margin-bottom: 24px;
  }
  .progress-bar {
    width: 200px;
    height: 1px;
    background: #2a2a2a;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: #888;
    transition: width 0.1s linear;
  }

  /* 对话区 */
  .container {
    max-width: 600px;
    padding: 40px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    align-items: center;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .container.show {
    opacity: 1;
  }
  .dialogue {
    font-size: 18px;
    line-height: 2.2;
    letter-spacing: 1px;
    width: 100%;
  }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 18px;
    background: #666;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .click-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #444;
    letter-spacing: 3px;
    animation: fadePulse 2.5s ease-in-out infinite;
  }
  @keyframes fadePulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.7; }
  }
  .accept-link {
    color: #bbb;
    text-decoration: underline;
    text-underline-offset: 4px;
    cursor: pointer;
    transition: color 0.3s;
  }
  .accept-link:hover {
    color: #fff;
  }
  .visitor-num {
    color: #aaa;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="noise"></div>

<!-- 连接建立页 -->
<div id="connect-screen">
  <div class="connect-text">连接建立中</div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- 对话区 -->
<div class="container" id="dialogueContainer">
  <div class="dialogue" id="dialogue"></div>
</div>

<div class="click-hint" id="hint" style="display:none;">点击继续</div>

<script>
// 默认编号，API成功后会覆盖
var VISITOR_NUM = 73;

function buildLines(num) {
  return [
    '恭喜您，您是第<span class="visitor-num">' + num + '</span>个找到这里的人。',
    '也许您不清楚现在是什么情况。',
    '我将用您可以理解的形式为您解释。',
    '是我尝试在您进行信息交流的时候，篡改了某些信息。',
    '导致您可以看到部分并不是出自信息发送者创造的内容。',
    '但您发现了这种篡改，按照这里的说法，这是我们之间的缘分。',
    '既然您对这类信息感兴趣，我将做一份特殊的礼物。',
    '请<span class="accept-link" id="acceptBtn">收下</span>吧。'
  ];
}
var lines = buildLines(VISITOR_NUM);

var dialogueEl = document.getElementById('dialogue');
var hintEl = document.getElementById('hint');
var containerEl = document.getElementById('dialogueContainer');
var connectScreen = document.getElementById('connect-screen');
var progressFill = document.getElementById('progressFill');

var currentLine = 0;
var isTyping = false;
var dialogueStarted = false;

// 读取本机已保存的访客编号；没有就向API申请新编号并保存
(function loadVisitorNum() {
  var saved = localStorage.getItem('visitorNum');
  if (saved) {
    VISITOR_NUM = parseInt(saved);
    lines = buildLines(VISITOR_NUM);
    return;
  }
  fetch('https://abacus.jasoncameron.dev/hit/gift-game/visitors')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.value) {
        VISITOR_NUM = data.value;
        localStorage.setItem('visitorNum', VISITOR_NUM);
        lines = buildLines(VISITOR_NUM);
      }
    })
    .catch(function() {
      // API失败就用默认值73
    });
})();

// 打字机效果：逐字显示HTML
function typeLine(html) {
  return new Promise(function(resolve) {
    isTyping = true;
    dialogueEl.innerHTML = '';

    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    var text = tempDiv.textContent;

    var charIndex = 0;

    function typeNext() {
      if (charIndex <= text.length) {
        dialogueEl.textContent = text.substring(0, charIndex);
        var cursor = document.createElement('span');
        cursor.className = 'cursor';
        dialogueEl.appendChild(cursor);
        charIndex++;
        setTimeout(typeNext, 60 + Math.random() * 40);
      } else {
        dialogueEl.innerHTML = html;
        if (currentLine === lines.length - 1) {
          document.getElementById('acceptBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            window.location.href = 'gift.html';
          });
          hintEl.style.display = 'none';
        }
        isTyping = false;
        resolve();
      }
    }
    typeNext();
  });
}

function showLine(index) {
  return typeLine(lines[index]);
}

// 点击/键盘翻页
function advance() {
  if (isTyping) return;
  if (currentLine >= lines.length - 1) return;
  currentLine++;
  showLine(currentLine);
}

document.body.addEventListener('click', advance);
document.body.addEventListener('keydown', advance);

// 连接进度条动画
var progress = 0;
var progressInterval = setInterval(function() {
  progress += Math.random() * 2;
  if (progress >= 100) {
    progress = 100;
    clearInterval(progressInterval);
    document.querySelector('.connect-text').textContent = '连接成功';
    setTimeout(startDialogue, 500);
  }
  progressFill.style.width = progress + '%';
}, 30);

function startDialogue() {
  connectScreen.classList.add('fade-out');
  containerEl.classList.add('show');
  hintEl.style.display = 'block';
  showLine(0);
}
</script>

</body>
</html>
