<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>treat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111; color: #888;
    font-family: "Songti SC", "SimSun", "Noto Serif SC", "宋体", serif;
    min-height: 100vh;
    overflow: hidden;
  }
  .noise {
    position: fixed; inset: 0; pointer-events: none;
    opacity: 0.06; z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .container {
    max-width: 600px; padding: 40px;
    margin: 0 auto; min-height: 100vh;
    display: flex; align-items: center;
  }
  .dialogue {
    font-size: 18px; line-height: 2.2; letter-spacing: 1px;
    width: 100%; color: #888;
  }
  .cursor {
    display: inline-block; width: 8px; height: 18px;
    background: #666; margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .click-hint {
    position: fixed; bottom: 40px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; color: #444; letter-spacing: 3px;
    animation: fadePulse 2.5s ease-in-out infinite;
  }
  @keyframes fadePulse {
    0%,100% { opacity: 0.2; } 50% { opacity: 0.7; }
  }
  .back-link {
    color: #bbb; text-decoration: underline;
    text-underline-offset: 4px; cursor: pointer;
    transition: color 0.3s;
  }
  .back-link:hover { color: #fff; }
  .counter {
    color: #aaa; font-weight: 500;
  }
  .options {
    margin-top: 30px; display: none;
    flex-direction: column; gap: 14px;
  }
  .options.show { display: flex; }
  .opt-btn {
    background: transparent; border: 1px solid #444;
    color: #888; font-family: inherit; font-size: 16px;
    padding: 10px 20px; letter-spacing: 6px; cursor: pointer;
    transition: all 0.3s;
  }
  .opt-btn:hover { border-color: #888; color: #aaa; }
</style>
</head>
<body>
<div class="noise"></div>
<div class="container">
  <div class="dialogue" id="dialogue"></div>
</div>
<div class="click-hint" id="hint">点击继续</div>

<script>
// X = 通关人数（到过ending的人），Y = 发现彩蛋的人（到过treat的人）
var X_COUNT = 0; // 通关人数
var Y_COUNT = 0; // 彩蛋发现人数

function buildLines(x, y) {
  return [
    '恭喜你找到这里。',
    '我在这个页面记录与多少人相会。',
    '至今我已经与<span class="counter">' + x + '</span>人完成沟通，',
    '其中只有<span class="counter">' + y + '</span>人看着这里。'
  ];
}
var lines = buildLines(X_COUNT, Y_COUNT);

var dialogueEl = document.getElementById('dialogue');
var hintEl = document.getElementById('hint');
var currentLine = 0;
var isTyping = false;

function typeLine(html) {
  return new Promise(function(resolve) {
    isTyping = true;
    dialogueEl.innerHTML = '';
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    var text = tempDiv.textContent;
    var charIndex = 0;
    function typeNext() {
      if (charIndex <= text.length) {
        dialogueEl.textContent = text.substring(0, charIndex);
        var cursor = document.createElement('span');
        cursor.className = 'cursor';
        dialogueEl.appendChild(cursor);
        charIndex++;
        setTimeout(typeNext, 60 + Math.random() * 40);
      } else {
        dialogueEl.innerHTML = html;
        isTyping = false;
        if (currentLine === lines.length - 1) {
          hintEl.style.display = 'none';
          // 显示两个按钮
          var btnHtml = '<div class="options show">' +
            '<button class="opt-btn" onclick="location.href=\'gift.html\'">回看交流</button>' +
            '<button class="opt-btn" onclick="window.close()">结束交流</button>' +
            '</div>';
          dialogueEl.innerHTML = html + btnHtml;
        }
        resolve();
      }
    }
    typeNext();
  });
}

async function showLine(i) {
  await typeLine(lines[i]);
}

document.body.addEventListener('click', function() {
  if (isTyping) return;
  if (currentLine >= lines.length - 1) return;
  currentLine++;
  showLine(currentLine);
});

// 1. 记录彩蛋访客（第一次打开才计数，刷新不重复）
var treatProm;
if (!localStorage.getItem('foundTreat')) {
  treatProm = fetch('https://abacus.jasoncameron.dev/hit/gift-game/treat-visitors')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      localStorage.setItem('foundTreat', '1');
      return data.value || 1;
    })
    .catch(function() { return 1; });
} else {
  treatProm = fetch('https://abacus.jasoncameron.dev/get/gift-game/treat-visitors')
    .then(function(r) { return r.json(); })
    .then(function(data) { return data.value || 1; })
    .catch(function() { return 1; });
}

// 2. 读取通关人数
var compProm = fetch('https://abacus.jasoncameron.dev/get/gift-game/completions')
  .then(function(r) { return r.json(); })
  .then(function(data) { return data.value || 0; })
  .catch(function() { return 0; });

// 两个数字都拿到后更新对话内容
Promise.all([compProm, treatProm]).then(function(results) {
  X_COUNT = results[0];
  Y_COUNT = results[1];
  lines = buildLines(X_COUNT, Y_COUNT);
});

showLine(0);
</script>
</body>
</html>
