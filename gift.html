<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gift</title>
<!--
  ============================================
  彩蛋：如果您看到这里，那么恭喜您发现了这部分内容。
  您来到这里的目的我不做猜测。
  现在，您可以在第五关输入 treat 进入特殊页面。
  祝您玩得愉快。
  ============================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;-webkit-tap-highlight-color: transparent; }
  body {
    background: #111; color: #888;
    font-family: "Songti SC", "SimSun", "Noto Serif SC", "宋体", serif;
    min-height: 100vh; overflow-y: auto; overflow-x: hidden;
  }
  .noise {
    position: fixed; inset: 0; pointer-events: none;
    opacity: 0.06; z-index: 100;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  .container {
    max-width: 600px; width: 100%; padding: 60px 20px;
    margin: 0 auto; text-align: center;
  }
  .level-nav {
    display: flex; justify-content: center; gap: 8px;
    margin-bottom: 30px;
  }
  .nav-btn {
    width: 36px; height: 36px;
    background: transparent; border: 1px solid #333;
    color: #555; font-family: inherit; font-size: 14px;
    cursor: not-allowed; transition: all 0.3s;
    border-radius: 2px;
  }
  .nav-btn.unlocked {
    color: #888; border-color: #555; cursor: pointer;
  }
  .nav-btn.unlocked:hover {
    color: #bbb; border-color: #888;
  }
  .nav-btn.current {
    color: #ccc; border-color: #888;
    background: rgba(255,255,255,0.05);
  }
  .puzzle { display: none; }
  .puzzle.show { display: block; }
  .puzzle-name {
    font-size: 13px; color: #555; letter-spacing: 4px; margin-bottom: 24px;
  }
  .question {
    font-size: 15px; line-height: 2.2; margin-bottom: 30px;
    letter-spacing: 1px; color: #999;
  }
  .shake { display: inline-block; animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .input-row {
    display: flex; gap: 10px; justify-content: center;
    align-items: center; margin-bottom: 16px;
  }
  input[type="text"] {
    background: transparent; border: none; border-bottom: 1px solid #444;
    color: #aaa; font-family: inherit; font-size: 16px;
    padding: 8px 4px; width: 200px; outline: none;
    text-align: center; letter-spacing: 2px;
  }
  input[type="text"]:focus { border-bottom-color: #888; }
  input::placeholder { color: #444; }
  .confirm-btn {
    background: transparent; border: 1px solid #444; color: #777;
    padding: 8px 16px; font-size: 13px; font-family: inherit;
    cursor: pointer; letter-spacing: 1px;
  }
  .feedback { font-size: 13px; color: #666; min-height: 20px; margin-bottom: 10px; }
  .hint-box { margin-top: 16px; font-size: 13px; color: #777; }
  .hint-btn {
    background: transparent; border: 1px solid #444; color: #777;
    padding: 6px 16px; font-size: 12px; font-family: inherit;
    cursor: pointer; margin: 8px 4px 0;
  }
  .grid {
    display: grid; grid-template-columns: repeat(3, 120px);
    gap: 0; justify-content: center; margin-bottom: 30px;
    border: 1px solid #333;
  }
  .grid-cell {
    width: 120px; height: 160px;
    border-right: 1px solid #222; border-bottom: 1px solid #222;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #444; cursor: pointer;
    position: relative; overflow: hidden;
  }
  .grid-cell:nth-child(3n) { border-right: none; }
  .grid-cell:nth-child(n+7) { border-bottom: none; }
  .grid-cell:hover { background: #1a1a1a; }
  .grid-cell .cell-num {
    position: absolute; top: 4px; left: 6px;
    font-size: 10px; color: #555; z-index: 2;
    text-shadow: 0 0 3px #000;
  }
  .grid-cell .upload-hint {
    font-size: 28px; color: #333; z-index: 1;
    pointer-events: none; user-select: none;
  }
  .grid-cell img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 1;
  }
  .grid-cell.cell-correct {
    box-shadow: inset 0 0 0 2px #6a6a6a;
  }
  .grid-cell.cell-correct::after {
    content: ""; position: absolute; inset: 0;
    background: rgba(255,255,255,0.06); z-index: 3; pointer-events: none;
  }
  /* 第三关：已点击的格子变暗 + 浮现序号 */
  .grid-cell .click-num {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.7);
    font-size: 52px; font-weight: 700; color: #fff;
    opacity: 0; pointer-events: none;
    text-shadow: 0 2px 14px rgba(0,0,0,.8);
    transition: opacity .35s ease, transform .35s ease;
    z-index: 5;
    font-family: 'Songti SC', 'SimSun', '宋体', serif;
  }
  .grid-cell.clicked { filter: brightness(.55); }
  .grid-cell.clicked .click-num {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
  }
  /* 题目文字抖动 */
  @keyframes titleShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .title-shake { animation: titleShake .5s ease; }
  /* 九宫格整体抖动（点错整轮时用） */
  @keyframes gridShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .grid-shake { animation: gridShake .5s ease; }
  /* 第三关中心格(5)细边框——仅作用于第三关(#presetGrid)，第二关不受影响 */
  #presetGrid .grid-cell[data-num="5"] {
    border: 1px solid rgba(210, 210, 210, 0.5);
    box-shadow: none;
    z-index: 2;
  }
  /* 第四关：合成按钮 */
  .merge-btn {
    position: absolute; right: 8px; bottom: 8px; z-index: 10;
    background: rgba(20,20,20,0.88); border: 1px solid #555;
    color: #bbb; font-size: 12px; font-family: inherit;
    padding: 6px 12px; cursor: pointer; letter-spacing: 1px;
    transition: all .3s ease;
  }
  .merge-btn:hover { border-color: #999; color: #ddd; background: rgba(30,30,30,0.9); }
  .merge-btn:disabled { opacity: .4; cursor: not-allowed; border-color: #444; color: #666; }
  /* 合成动画：九宫格向中心聚拢 */
  @keyframes mergeCollapse {
    0% { transform: scale(1) translate(0,0); opacity: 1; }
    100% { transform: scale(.05) translate(0,0); opacity: 0; }
  }
  .grid-cell.merging { animation: mergeCollapse .7s ease forwards; pointer-events: none; }
  /* 合成后大图淡入 */
  @keyframes mergedIn {
    0% { opacity: 0; transform: scale(.92); }
    100% { opacity: 1; transform: scale(1); }
  }
  #mergedImg.show { animation: mergedIn .5s ease forwards; animation-delay: .6s; }
  /* 第四关九宫格宽度与合成图匹配 */
  #mergeGrid { position: relative; z-index: 1; }
  /* 第三关提示块 */
  .l3-tip-block {
    margin-top: 14px; font-size: 14px; color: #bbb;
    font-family: 'Songti SC','SimSun','宋体',serif;
    text-align: center;
  }
  .l3-tip-ask {
    cursor: pointer; margin: 8px 14px 0;
    padding: 6px 14px; border: 1px solid #555; border-radius: 3px;
    display: inline-block; font-size: 14px;
    background: transparent; color: #ccc;
    font-family: 'Songti SC','SimSun','宋体',serif;
    transition: border-color .3s;
  }
  .l3-tip-ask:hover { border-color: #aaa; }
  .l3-tip-content {
    margin-top: 10px; display: none;
    line-height: 1.8; color: #ccc;
    font-family: 'Songti SC','SimSun','宋体',serif;
    text-align: center; padding: 8px 6px;
  }

  .qa-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    display: none; align-items: center; justify-content: center;
    z-index: 300; padding: 20px;
  }
  .qa-overlay.show { display: flex; }
  .qa-card-wrap {
    position: relative; width: 100%; max-width: 420px;
    display: grid;
  }
  .qa-card {
    grid-area: 1 / 1;
    background: #151515; border: 1px solid #333;
    padding: 36px 28px; text-align: center;
    display: flex; flex-direction: column; justify-content: center;
    min-height: 320px; max-height: calc(100vh - 40px); overflow-y: auto;
    transform: translateY(-40px); opacity: 0;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }
  .qa-card.active { transform: translateY(0); opacity: 1; }
  .qa-card.exit { transform: translateY(40px); opacity: 0; }
  /* 提问卡：问题置顶，回答在下方自上而下排布 */
  .qa-card.qa-top { justify-content: flex-start; }
  .qa-text {
    font-size: 15px; line-height: 2.1; color: #999;
    letter-spacing: 1px; min-height: 70px; text-align: left;
  }
  .qa-text .cursor {
    display: inline-block; width: 8px; height: 16px;
    background: #666; margin-left: 2px; vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  /* 选中后浮现到卡片最上方的提问 */
  .qa-question-top {
    color: #bbb; letter-spacing: 1px; font-family: inherit;
    opacity: 0; transform: translateY(-6px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .qa-question-top.show { opacity: 1; transform: translateY(0); }
  /* 提问下方空一行后再出回答 */
  .qa-answer {
    margin-top: 1.8em; color: #999; letter-spacing: 1px; font-family: inherit;
  }
  .qa-options {
    margin-top: 18px; text-align: left;
    opacity: 0; transition: opacity 0.4s ease;
  }
  .qa-options.show { opacity: 1; }
  .qa-opt {
    padding: 10px 14px; border-bottom: 1px solid #222;
    font-size: 14px; color: #888; cursor: pointer;
    transition: all 0.4s ease; line-height: 1.6;
  }
  .qa-opt:hover { color: #bbb; background: #1a1a1a; padding-left: 18px; }
  .qa-continue {
    margin-top: 18px; opacity: 0; transition: opacity 0.4s ease;
  }
  .qa-continue.show { opacity: 1; }

 #mobileSaveBtn {
   display: none;
   position: absolute;
   bottom: 8px;
   left: 8px;
   z-index: 10;
   font-size: 11px;
   padding: 4px 10px;
 }

  @media (max-width: 768px) {
    #mobileSaveBtn.ready { display: inline-block; }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(3, 100px); }
    .grid-cell { width: 100px; height: 133px; }
    .grid-wrap { width: 300px !important; }
    .grid5-wrap { width: 100% !important; }
    .grid5-controls, .grid5-wrap + div { width: 100% !important; }
  }

  /* ===== 第五关 相交 ===== */
  .grid5-wrap {
    position: relative;
    width: 560px;
    max-width: 100%;
    margin: 0 auto 20px;
  }
  .grid5-upload-area {
    position: relative;
    width: 100%;
    height: 270px;
    background: #222;
    border: 1px solid #333;
    cursor: pointer;
    overflow: hidden;
  }
  .grid5-upload-area:hover { border-color: #555; }
  .grid5-upload-hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #666;
    font-size: 20px;
    letter-spacing: 2px;
    pointer-events: none;
    text-align: center;
    line-height: 1.6;
  }
  #grid5Image {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    pointer-events: none;
  }
  #grid5Canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    cursor: crosshair;
    pointer-events: none;
  }
  /* 上传按钮（区域下方，样式统一） */
  .grid5-upload-btn {
    display: inline-block;
    background: rgba(20,20,20,0.88);
    border: 1px solid #555;
    color: #bbb;
    font-size: 13px;
    font-family: inherit;
    padding: 6px 16px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .3s ease;
    margin-bottom: 10px;
  }
  .grid5-upload-btn:hover { border-color: #999; color: #ddd; background: rgba(30,30,30,0.9); }
  .grid5-controls {
    width: 560px;
    max-width: 100%;
    margin: 0 auto;
    display: flex;
    justify-content: flex-end;
    margin-bottom: 30px;
  }
  .grid5-reset-btn {
    background: rgba(20,20,20,0.88);
    border: 1px solid #555;
    color: #bbb;
    font-size: 13px;
    font-family: inherit;
    padding: 6px 16px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .3s ease;
  }
  .grid5-reset-btn:hover { border-color: #999; color: #ddd; background: rgba(30,30,30,0.9); }
  /* 网格抖动 */
  .grid-shake {
    animation: gridShake 0.4s ease;
  }
  @keyframes gridShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
</style>
</head>
<body>

<div class="noise"></div>

<div class="container">

  <div class="level-nav" id="levelNav">
    <button class="nav-btn" data-lvl="1" onclick="navGo(1)">一</button>
    <button class="nav-btn" data-lvl="2" onclick="navGo(2)">二</button>
    <button class="nav-btn" data-lvl="3" onclick="navGo(3)">三</button>
    <button class="nav-btn" data-lvl="4" onclick="navGo(4)">四</button>
    <button class="nav-btn" data-lvl="5" onclick="navGo(5)">五</button>
  </div>

  <div class="puzzle" id="puzzle1">
    <div class="puzzle-name">— 相同 —</div>
    <p class="question">我在那条信号携带的九条信号里，<br/>随机选了三条，都加入了一条<span class="shake-target" id="shake1">相同</span>的信息。<br/>请找到它。</p>
    <div class="input-row">
      <input type="text" id="input1" placeholder="..." autocomplete="off">
      <button class="confirm-btn" onclick="checkPuzzle1()">确认</button>
    </div>
    <p class="feedback" id="feedback1"></p>
    <div id="hintContainer1"></div>
  </div>

  <div class="puzzle" id="puzzle2">
    <div class="puzzle-name">— 大小 —</div>
    <p class="question">除了那些，我还加入了别的内容。<br/>为了方便发现，请按照<span class="shake-target" id="shake2">大小</span>顺序放入信息。<br/><span style="font-size:12px;color:#555;letter-spacing:1px;"></span></p>
    <div class="grid" id="uploadGrid">
      <div class="grid-cell" data-num="1"><span class="cell-num">1</span><span class="upload-hint">+</span></div>
      <div class="grid-cell" data-num="2"><span class="cell-num">2</span><span class="upload-hint">+</span></div>
      <div class="grid-cell" data-num="3"><span class="cell-num">3</span><span class="upload-hint">+</span></div>
      <div class="grid-cell" data-num="4"><span class="cell-num">4</span><span class="upload-hint">+</span></div>
      <div class="grid-cell" data-num="5"><span class="cell-num">5</span><span class="upload-hint">+</span></div>
      <div class="grid-cell" data-num="6"><span class="cell-num">6</span><span class="upload-hint">+</span></div>
      <div class="grid-cell" data-num="7"><span class="cell-num">7</span><span class="upload-hint">+</span></div>
      <div class="grid-cell" data-num="8"><span class="cell-num">8</span><span class="upload-hint">+</span></div>
      <div class="grid-cell" data-num="9"><span class="cell-num">9</span><span class="upload-hint">+</span></div>
    </div>
    <div class="input-row">
      <input type="text" id="input2" placeholder="..." autocomplete="off">
      <button class="confirm-btn" onclick="checkPuzzle2()">确认</button>
    </div>
    <p class="feedback" id="feedback2"></p>
    <div id="hintContainer2"></div>
  </div>

  <div class="puzzle" id="puzzle3">
    <div class="puzzle-name">— 上下 —</div>
    <p class="question"><br/>接下来，请按照<span class="shake-target" id="shake3">上下</span>顺序点击信息。</p>
    <div class="grid" id="presetGrid">
      <div class="grid-cell" data-num="1"></div>
      <div class="grid-cell" data-num="2"></div>
      <div class="grid-cell" data-num="3"></div>
      <div class="grid-cell" data-num="4"></div>
      <div class="grid-cell" data-num="5"></div>
      <div class="grid-cell" data-num="6"></div>
      <div class="grid-cell" data-num="7"></div>
      <div class="grid-cell" data-num="8"></div>
      <div class="grid-cell" data-num="9"></div>
    </div>
    <p class="feedback" id="feedback3"></p>
    <div id="hintContainer3"></div>
  </div>

  <div class="puzzle" id="puzzle4">
    <div class="puzzle-name">— 属性 —</div>
    <p class="question"><span class="shake-target" id="shake4">请合并图片</span>。</p>
    <div class="grid-wrap" style="position:relative; width:360px; margin:0 auto 30px;">
      <div class="grid" id="mergeGrid">
        <div class="grid-cell" data-num="1"></div>
        <div class="grid-cell" data-num="2"></div>
        <div class="grid-cell" data-num="3"></div>
        <div class="grid-cell" data-num="4"></div>
        <div class="grid-cell" data-num="5"></div>
        <div class="grid-cell" data-num="6"></div>
        <div class="grid-cell" data-num="7"></div>
        <div class="grid-cell" data-num="8"></div>
        <div class="grid-cell" data-num="9"></div>
      </div>
	  
	  
      <div class="merged-img-wrap" id="mergedWrap" style="position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#181818; border:1px solid #333;">
        <img id="mergedImg" style="width:100%; height:100%; object-fit:cover; opacity:0; transform:scale(.92);" />
		 <a id="mobileSaveBtn" class="merge-btn" style="text-decoration:none;" download="length × width.jpg">保存图片</a>
      </div>
      <button id="mergeBtn" class="merge-btn">合成新信号</button>
     
	  
	  
	  
    </div>
    <div class="input-row" id="puzzle4Input" style="display:none;">
      <input type="text" id="input4" placeholder="..." autocomplete="off">
      <button class="confirm-btn" onclick="checkPuzzle4()">确认</button>
    </div>
    <p class="feedback" id="feedback4"></p>
    <div id="hintContainer4"></div>
  </div>

  <div class="puzzle" id="puzzle5">
    <div class="puzzle-name">— 相交 —</div>
    <p class="question"><span class="shake-target" id="shake5">浮出 投诉 欢迎</span>。</p>
    <div class="grid5-wrap" id="grid5Wrap">
      <div class="grid5-upload-area" id="grid5UploadArea">
        <span class="grid5-upload-hint" id="grid5UploadHint">点击下方按钮<br>上传合成的新信号</span>
        <img id="grid5Image" style="display:none;" />
        <canvas id="grid5Canvas"></canvas>
      </div>
    </div>
    <input type="file" id="grid5FileInput" accept="image/*" style="display:none;" />
    <div style="width:560px;max-width:100%;margin:0 auto 0;display:flex;justify-content:space-between;align-items:center;">
      <button class="grid5-upload-btn" id="grid5UploadBtn">上传图片</button>
      <button class="grid5-reset-btn" id="grid5ResetBtn">重置</button>
    </div>
    <div class="input-row" style="margin-top:20px;">
      <input type="text" id="input5" placeholder="..." autocomplete="off">
      <button class="confirm-btn" onclick="checkPuzzle5()">确认</button>
    </div>
    <p class="feedback" id="feedback5"></p>
    <div id="hintContainer5"></div>
  </div>

</div>

<div class="qa-overlay" id="qaOverlay">
  <div class="qa-card-wrap" id="qaWrap"></div>
</div>

<script>
// ===== 数据（问题树）=====
var questionTree = {
  "1": {
    q: "我是什么存在。",

        children: {}
      }

  "2": {

    children: {
      "2.1": {

var overlay = document.getElementById("qaOverlay");
var wrap = document.getElementById("qaWrap");

function typeText(el, text, cb) {
  var i = 0;
  el.innerHTML = '<span class="cursor"></span>';
  function step() {
    if (i <= text.length) {
      el.innerHTML = text.substring(0, i) + '<span class="cursor"></span>';
      i++;
      setTimeout(step, 50 + Math.random() * 40);
    } else {
      el.innerHTML = text;
      if (cb) cb();
    }
  }
  step();
}

function newCard(onReady) {
  var old = wrap.querySelector(".qa-card");
  if (old) {
    old.classList.add("exit");
    setTimeout(function() { old.remove(); }, 500);
  }
  var card = document.createElement("div");
  card.className = "qa-card";
  card.innerHTML = '<div class="qa-text"></div><div class="qa-options"></div><div class="qa-continue"><button class="hint-btn" id="qaNextBtn">继续</button></div>';
  wrap.appendChild(card);
  setTimeout(function() { card.classList.add("active"); }, 50);
  setTimeout(function() { onReady(card); }, 550);
}

function showCard(card, text, options, onSelect) {
  var textEl = card.querySelector(".qa-text");
  var optEl = card.querySelector(".qa-options");
  var contEl = card.querySelector(".qa-continue");
  contEl.classList.remove("show");
  optEl.classList.remove("show");
  optEl.innerHTML = "";

  typeText(textEl, text, function() {
    if (options && options.length > 0) {
      options.forEach(function(opt) {
        var d = document.createElement("div");
        d.className = "qa-opt";
        d.textContent = opt.label;
        d.onclick = function() {
          var selectedLabel = d.textContent;
          // 其他选项淡出消失
          var allOpts = optEl.querySelectorAll(".qa-opt");
          allOpts.forEach(function(o, i) {
            if (o !== d) {
              setTimeout(function() {
                o.style.opacity = "0";
                o.style.transform = "translateY(-10px)";
              }, i * 80);
            }
          });
          // 选中的选项往上移
          setTimeout(function() {
            d.style.opacity = "0";
            d.style.transform = "translateY(-20px)";
          }, 300);
          setTimeout(function() {
            // 提示文字清空，显示选中的问题
            textEl.innerHTML = "";
            textEl.style.color = "#bbb";
            textEl.textContent = selectedLabel;
            optEl.classList.remove("show");
            optEl.innerHTML = "";
            if (onSelect) onSelect(opt.value);
          }, 600);
        };
        optEl.appendChild(d);
      });
      optEl.classList.add("show");
    } else {
      contEl.classList.add("show");
    }
  });
}

function showAnswer(card, key, answerText, onDone) {
  currentBranch = key;
  var textEl = card.querySelector(".qa-text");
  var contEl = card.querySelector(".qa-continue");
  contEl.classList.remove("show");

  var questionText = textEl.textContent;

  // 切到顶部对齐：问题固定在卡片最上方，回答在下方
  card.classList.add("qa-top");

  textEl.innerHTML = "";
  // 问题浮现到卡片最上方
  var questionEl = document.createElement("div");
  questionEl.className = "qa-question-top";
  questionEl.textContent = questionText;
  textEl.appendChild(questionEl);

  // 空一行后打答案
  var answerEl = document.createElement("div");
  answerEl.className = "qa-answer";
  textEl.appendChild(answerEl);

  // 问题先淡入浮现
  setTimeout(function() { questionEl.classList.add("show"); }, 50);

  // 稍后开始打字回答
  setTimeout(function() {
    typeText(answerEl, answerText, function() {
      contEl.classList.add("show");
    });
  }, 260);

  var btn = card.querySelector("#qaNextBtn");
  btn.textContent = "继续";
  btn.onclick = onDone;
}

function closeQA(cb) {
  overlay.classList.remove("show");
  setTimeout(function() {
    wrap.innerHTML = "";
    if (cb) cb();
  }, 500);
}

var correctOrder = ["7","8","2","9","6"];
var clickProgress = [];
var wrongCount3 = 0;
var hintShown3 = false;
var l3Locked = false;

// 加载预设图片
document.querySelectorAll("#presetGrid .grid-cell").forEach(function(cell) {
  var num = cell.dataset.num;
  var src = presetImages[num];
  if (src) {
    var img = document.createElement("img");
    img.src = src;
    img.onerror = function() { this.remove(); cell.style.background = "#222"; };
    cell.appendChild(img);
  } else {
    cell.style.background = "#222";
  }
});

// 点击判定：整轮（连点5格）后统一比对
document.querySelectorAll("#presetGrid .grid-cell").forEach(function(cell) {
  cell.addEventListener("click", function() {
    if (l3Locked) return;
    if (clickProgress.length >= correctOrder.length) return;
    var num = this.dataset.num;
    // 同一轮内已点过的格子不允许重复点
    if (clickProgress.indexOf(num) !== -1) return;

    // 给被点格子加"变暗+序号"反馈
    clickProgress.push(num);
    markClicked(this, clickProgress.length);

    if (clickProgress.length === correctOrder.length) {
      // 点满5格，延迟一点再判定，让第5下的数字先显示出来
      l3Locked = true;
      setTimeout(checkRoundResult, 350);
    }
  });
});

function markClicked(cell, idx) {
  cell.classList.add("clicked");
  // 序号大字：阿拉伯数字
  var span = document.createElement("span");
  span.className = "click-num";
  span.textContent = String(idx);
  cell.appendChild(span);
}

function clearClickMarks() {
  document.querySelectorAll("#presetGrid .grid-cell").forEach(function(c) {
    c.classList.remove("clicked");
    var num = c.querySelector(".click-num");
    if (num) num.remove();
  });
}

function checkRoundResult() {
  var allRight = true;
  for (var i = 0; i < correctOrder.length; i++) {
    if (clickProgress[i] !== correctOrder[i]) { allRight = false; break; }
  }
  if (allRight) {
    document.getElementById("feedback3").textContent = "";
    // 通关：清掉数字、弹出第三关后的"您是否对我产生好奇？"询问卡
    clearClickMarks();
    setTimeout(afterPuzzle3, 400);
  } else {
    // 错一整轮：九宫格 + "上下"同步抖动、显示"不对。"、然后清掉标记
    var shakeEl = document.getElementById("shake3");
    var gridEl = document.getElementById("presetGrid");
    shakeEl.classList.remove("title-shake");
    gridEl.classList.remove("grid-shake");
    void shakeEl.offsetWidth;
    void gridEl.offsetWidth;
    shakeEl.classList.add("title-shake");
    gridEl.classList.add("grid-shake");
    document.getElementById("feedback3").textContent = "不对。";
    wrongCount3++;
    // 抖动时长 ≈ 500ms，动画结束后再清标记
    setTimeout(function() {
      clearClickMarks();
      clickProgress = [];
      l3Locked = false;
      document.getElementById("feedback3").textContent = "";
      if (wrongCount3 >= 3 && !hintShown3) showHint3();
    }, 900);
  }
}

function showHint3() {
  hintShown3 = true;
  var c = document.getElementById("hintContainer3");
  var b = document.createElement("div");
  b.className = "l3-tip-block";
  b.innerHTML = '<p style="margin-bottom:4px;">需要提示吗？</p>' +
    '<span class="l3-tip-ask" onclick="revealHint3(this)">是</span>' +
    '<span class="l3-tip-ask" onclick="this.parentElement.style.display=\'none\'">否</span>' +

        }
      );
    });
  }
}

function showHint4() {
  hintShown4 = true;
  var c = document.getElementById("hintContainer4");
  var b = document.createElement("div");
  b.className = "l3-tip-block";
  b.innerHTML = '<p style="margin-bottom:4px;">需要提示吗？</p>' +
    '<span class="l3-tip-ask" onclick="revealHint4(this)">是</span>' +
    '<span class="l3-tip-ask" onclick="this.parentElement.style.display=\'none\'">否</span>' +
    '<p class="l3-tip-content">请下载图片</p>';
  c.appendChild(b);
}

function revealHint4(btn) {
  var block = btn.parentElement;
  block.querySelectorAll(".l3-tip-ask").forEach(function(b) { b.style.display = "none"; });
  block.querySelector("p").style.display = "none";
  block.querySelector(".l3-tip-content").style.display = "block";
}

// 重写goToPuzzle，跳第四关时初始化
var _origGoTo = goToPuzzle;
goToPuzzle = function(num) {
  _origGoTo(num);
  if (num === 4) setTimeout(initLevel4, 500);
  if (num === 5) setTimeout(initLevel5, 500);
};

// ===== 第五关 相交 =====
var grid5UploadArea = document.getElementById("grid5UploadArea");
var grid5UploadBtn = document.getElementById("grid5UploadBtn");
var grid5FileInput = document.getElementById("grid5FileInput");
var grid5Image = document.getElementById("grid5Image");
var grid5Canvas = document.getElementById("grid5Canvas");
var grid5Ctx = grid5Canvas.getContext("2d");
var grid5ResetBtn = document.getElementById("grid5ResetBtn");
var grid5UploadHint = document.getElementById("grid5UploadHint");
var input5 = document.getElementById("input5");
input5.addEventListener("keydown", function(e) { if (e.key === "Enter") checkPuzzle5(); });

// 原图 2160x2880（3:4竖版）；显示区按容器宽度动态缩放
var ORIG_W = 2160, ORIG_H = 2880;
var DISP_W = 560, DISP_H = 747;

// 网格参数（精调对齐四个关键词）
var OFFSET_X = 211, OFFSET_Y = 406;
var CELL_W = 66, CELL_H = 38.5;
var SPECIAL_COL = 19, SPECIAL_COL_W = 62;
var SPECIAL_ROW = -1, SPECIAL_ROW_H = 38.5;
var LINE_OPACITY = 0.25;
// 显示坐标下的格子尺寸（由 setupGrid5Canvas 动态设置）
var SCALE, CW, CH, OX, OY, SCW, SRH, COLS, ROWS;

// 状态
var grid5ImgLoaded = false;
var selectedCells = [];
var wrongCount5 = 0;
var hintShown5 = false;
var level5Inited = false;

// ---- 设置 canvas 像素尺寸（高清），并按当前容器实际宽度计算坐标 ----
function setupGrid5Canvas() {
  var cssW = grid5UploadArea.clientWidth;
  var cssH = Math.round(cssW * (ORIG_H / ORIG_W));
  DISP_W = cssW;
  DISP_H = cssH;
  grid5UploadArea.style.height = cssH + "px";

  SCALE = DISP_W / ORIG_W;
  CW = CELL_W * SCALE;
  CH = CELL_H * SCALE;
  OX = OFFSET_X * SCALE;
  OY = OFFSET_Y * SCALE;
  SCW = SPECIAL_COL_W * SCALE;
  SRH = SPECIAL_ROW_H * SCALE;
  COLS = Math.ceil((DISP_W - OX) / CW) + 2;
  ROWS = Math.ceil((DISP_H - OY) / CH) + 2;

  var dpr = window.devicePixelRatio || 1;
  grid5Canvas.width = DISP_W * dpr;
  grid5Canvas.height = DISP_H * dpr;
  grid5Ctx.setTransform(1,0,0,1,0,0);
  grid5Ctx.scale(dpr, dpr);
  grid5Canvas.style.width = DISP_W + "px";
  grid5Canvas.style.height = DISP_H + "px";
  grid5Canvas.style.pointerEvents = "auto";
  grid5Canvas.style.cursor = "crosshair";
}

// 列c的左边缘x（考虑特殊列）
function colX(c) {
  var x = OX;
  for (var i = 0; i < c; i++) {
    x += (i === SPECIAL_COL) ? SCW : CW;
  }
  return x;
}
function colW(c) { return (c === SPECIAL_COL) ? SCW : CW; }
// 行r的上边缘y（考虑特殊行）
function rowY(r) {
  var y = OY;
  for (var i = 0; i < r; i++) {
    y += (i === SPECIAL_ROW) ? SRH : CH;
  }
  return y;
}
function rowH(r) { return (r === SPECIAL_ROW) ? SRH : CH; }
// 像素x→列号
function xToCol(x) {
  var cx = OX;
  for (var c = 0; c < COLS; c++) {
    var w = colW(c);
    if (x >= cx && x < cx + w) return c;
    cx += w;
  }
  return COLS - 1;
}
// 像素y→行号
function yToRow(y) {
  var cy = OY;
  for (var r = 0; r < ROWS; r++) {
    var h = rowH(r);
    if (y >= cy && y < cy + h) return r;
    cy += h;
  }
  return ROWS - 1;
}

// ---- 重绘 canvas：图片(底) + 变暗高亮 + 网格线 + 点 ----
function drawGrid5() {
  grid5Ctx.clearRect(0, 0, DISP_W, DISP_H);

  // 1. 绘制图片
  if (grid5ImgLoaded && grid5Image.complete && grid5Image.naturalWidth > 0) {
    grid5Ctx.drawImage(grid5Image, 0, 0, DISP_W, DISP_H);
  }

  // 2. 高亮行/列（变暗效果）
  var highRows = {}, highCols = {};
  selectedCells.forEach(function(cell) { highRows[cell.row] = true; highCols[cell.col] = true; });
  grid5Ctx.fillStyle = "rgba(0,0,0,0.4)";
  Object.keys(highRows).forEach(function(r) {
    r = parseInt(r);
    grid5Ctx.fillRect(0, rowY(r), DISP_W, rowH(r));
  });
  Object.keys(highCols).forEach(function(c) {
    c = parseInt(c);
    grid5Ctx.fillRect(colX(c), 0, colW(c), DISP_H);
  });

  // 3. 绘制网格线
  grid5Ctx.strokeStyle = "rgba(255,255,255," + LINE_OPACITY + ")";
  grid5Ctx.lineWidth = 0.5;
  grid5Ctx.beginPath();
  // 左侧补线
  for (var lx = OX - CW; lx > -1; lx -= CW) {
    grid5Ctx.moveTo(Math.round(lx) + 0.5, 0);
    grid5Ctx.lineTo(Math.round(lx) + 0.5, DISP_H);
  }
  for (var c = 0; c <= COLS; c++) {
    var x = colX(c);
    if (x < -1 || x > DISP_W + 1) continue;
    grid5Ctx.moveTo(Math.round(x) + 0.5, 0);
    grid5Ctx.lineTo(Math.round(x) + 0.5, DISP_H);
  }
  // 顶部补线
  for (var ly = OY - CH; ly > -1; ly -= CH) {
    grid5Ctx.moveTo(0, Math.round(ly) + 0.5);
    grid5Ctx.lineTo(DISP_W, Math.round(ly) + 0.5);
  }
  for (var r = 0; r <= ROWS; r++) {
    var y = rowY(r);
    if (y < -1 || y > DISP_H + 1) continue;
    grid5Ctx.moveTo(0, Math.round(y) + 0.5);
    grid5Ctx.lineTo(DISP_W, Math.round(y) + 0.5);
  }
  grid5Ctx.stroke();

  // 4. 交叉点小白圆
  grid5Ctx.fillStyle = "#fff";
  selectedCells.forEach(function(cell) {
    var x = colX(cell.col) + colW(cell.col) / 2;
    var y = rowY(cell.row) + rowH(cell.row) / 2;
    if (x < 0 || y < 0 || x > DISP_W || y > DISP_H) return;
    grid5Ctx.beginPath();
    grid5Ctx.arc(x, y, 4, 0, Math.PI * 2);
    grid5Ctx.fill();
  });
}

// ---- 打开文件选择（仅按钮触发）----
function triggerGrid5Upload() { grid5FileInput.click(); }
grid5UploadBtn.addEventListener("click", triggerGrid5Upload);

grid5FileInput.addEventListener("change", function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    grid5Image.src = ev.target.result;
    grid5Image.onload = function() {
      grid5ImgLoaded = true;
      grid5UploadHint.style.display = "none";
      drawGrid5();
    };
  };
  reader.readAsDataURL(file);
});

// ---- 点击 canvas 选格 ----
grid5Canvas.addEventListener("click", function(e) {
  if (!grid5ImgLoaded) {
    document.getElementById("feedback5").textContent = "请先上传图片。";
    setTimeout(function() { document.getElementById("feedback5").textContent = ""; }, 1500);
    return;
  }
  e.stopPropagation();
  var rect = grid5Canvas.getBoundingClientRect();
  var x = (e.clientX - rect.left) * (DISP_W / rect.width);
  var y = (e.clientY - rect.top) * (DISP_H / rect.height);

  var col = xToCol(x);
  var row = yToRow(y);

  // 已选？→ 熄灭
  var idx = -1;
  for (var i = 0; i < selectedCells.length; i++) {
    if (selectedCells[i].col === col && selectedCells[i].row === row) { idx = i; break; }
  }
  if (idx !== -1) {
    selectedCells.splice(idx, 1);
  } else {
    if (selectedCells.length >= 3) selectedCells.shift();
    selectedCells.push({ col: col, row: row });
  }
  drawGrid5();
});

// ---- 重置 ----
grid5ResetBtn.addEventListener("click", function() {
  selectedCells = [];
  drawGrid5();
  document.getElementById("feedback5").textContent = "";
});

// ---- 密码检查 ----
function checkPuzzle5() {
  var val = input5.value.trim();
  if (val === "异常") {
    document.getElementById("feedback5").textContent = "";
    input5.disabled = true;
    setTimeout(function() { window.location.href = "ending.html"; }, 400);
  } else if (val.toLowerCase() === "treat") {
    document.getElementById("feedback5").textContent = "";
    setTimeout(function() { window.location.href = "treat.html"; }, 400);
  } else {
    wrongCount5++;
    var shakeEl = document.getElementById("shake5");
    var wrap = document.getElementById("grid5Wrap");
    shakeEl.classList.remove("title-shake");
    wrap.classList.remove("grid-shake");
    void shakeEl.offsetWidth;
    void wrap.offsetWidth;
    shakeEl.classList.add("title-shake");
    wrap.classList.add("grid-shake");
    document.getElementById("feedback5").textContent = "不对。";
    input5.value = "";
    selectedCells = [];
    drawGrid5();
    if (wrongCount5 >= 3 && !hintShown5) showHint5();
  }
}

function showHint5() {
  hintShown5 = true;
  var c = document.getElementById("hintContainer5");
  var b = document.createElement("div");
  b.className = "l3-tip-block";
  b.innerHTML = '<p style="margin-bottom:4px;">需要提示吗？</p>' +
    '<span class="l3-tip-ask" onclick="revealHint5(this)">是</span>' +
    '<span class="l3-tip-ask" onclick="this.parentElement.style.display=\'none\'">否</span>' +
    '<p class="l3-tip-content">请上传之前合成的新信号并仔细观察表格。</p>';
  c.appendChild(b);
}

function revealHint5(btn) {
  var block = btn.parentElement;
  block.querySelectorAll(".l3-tip-ask").forEach(function(b) { b.style.display = "none"; });
  block.querySelector("p").style.display = "none";
  block.querySelector(".l3-tip-content").style.display = "block";
}

function initLevel5() {
  if (level5Inited) return;
  level5Inited = true;
  setupGrid5Canvas();
  drawGrid5();
}

// ===== 顶部导航栏逻辑 =====
function getUnlocked() {
  var v = parseInt(localStorage.getItem('unlockedLevels'));
  return (v >= 1 && v <= 5) ? v : 1;
}
function setUnlocked(n) {
  var cur = getUnlocked();
  if (n > cur) localStorage.setItem('unlockedLevels', n);
}
function isCompleted() {
  return localStorage.getItem('completedGame') === '1';
}
function updateNav() {
  var maxUnlocked = isCompleted() ? 5 : getUnlocked();
  document.querySelectorAll('.nav-btn').forEach(function(btn) {
    var lvl = parseInt(btn.dataset.lvl);
    btn.classList.remove('unlocked', 'current');
    if (lvl <= maxUnlocked) btn.classList.add('unlocked');
    if (lvl === currentPuzzle) btn.classList.add('current');
  });
}
function navGo(n) {
  var maxUnlocked = isCompleted() ? 5 : getUnlocked();
  if (n > maxUnlocked) {
    // 锁定：提示
    var fb = document.getElementById('feedback' + currentPuzzle);
    if (fb) {
      var old = fb.textContent;
      fb.textContent = '请您先完成前面的关卡。';
      setTimeout(function() { fb.textContent = old; }, 1500);
    }
    return;
  }
  if (n === currentPuzzle) return;
  // 直接跳转，不弹Q&A
  goToPuzzle(n);
  updateNav();
}

// 启动（支持 ?lvl=数字 直接跳到指定关卡，方便测试）
var startLvl = parseInt(new URLSearchParams(location.search).get('lvl')) || 1;
if (startLvl < 1 || startLvl > 5) startLvl = 1;
// 如果是通关后回来，五关全亮但停在第一关
if (isCompleted()) startLvl = 1;
currentPuzzle = startLvl;
document.getElementById("puzzle" + startLvl).style.display = "block";
if (startLvl === 4) initLevel4();
if (startLvl === 5) initLevel5();
setTimeout(function() {
  document.getElementById("puzzle" + startLvl).classList.add("show");
  updateNav();
}, 100);
</script>
